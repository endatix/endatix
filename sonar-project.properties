# SonarCloud analysis settings.
#
# Analysis itself is configured in the SonarCloud UI (Automatic Analysis); this file only
# carries settings that belong with the source, so they are reviewed and versioned alongside
# the code they describe.

# Exclude EF Core migrations from copy-paste detection.
#
# Migrations are generated by `dotnet ef migrations add` and are never hand-edited. Supporting
# both PostgreSQL and SQL Server means every schema change produces two near-identical sets of
# files — the same tables and columns described twice, differing only in provider specifics such
# as jsonb vs json and the filtered-index predicate syntax. Roughly 70% of the lines match
# between providers, which is inherent to the two-provider design rather than something a
# refactor could remove.
#
# Scoped to duplication only: these files stay in scope for every other rule, so hand-written SQL
# inside a migration is still analysed for bugs and security issues.
sonar.cpd.exclusions=**/Migrations/**
