name: Build, Test & Release

# Thin consumer of endatix/release-workflows (see its README):
#   • a PR that touches the product paths below → tests + SonarCloud + build
#     validation in the shared pipeline, which runs alongside the tests
#     (scripts/release-prepare.sh @ 0.0.0-ci — builds + packs, publishes nothing).
#     A docs-only PR skips those jobs; the checks still pass.
#   • push main, same paths → tests, then canary vX.Y.Z-canary.N: semantic-release builds
#     once at the real version and publishes the NuGet packages to GitHub
#     Packages (canaries NEVER go to nuget.org — it is public and immutable).
#   • stable releases → MANUAL, human-reviewed: run "Start Stable Release"
#     (release-start.yml) → edit the draft notes → click "Publish release" →
#     release-artifacts.yml rebuilds at the tag and publishes to GitHub
#     Packages + nuget.org.
#
# The canary publishes ONLY after unit + integration tests pass (needs: below).
# Repo-specific release logic lives in scripts/release-prepare.sh and
# scripts/release-publish.sh (the consumer contract), plus the dormant `stable`
# branch required by semantic-release's branch validation.

on:
  # Every PR, stacked ones included (base = another feature branch). No paths
  # filter here: a workflow that does not start leaves required checks pending.
  # The changes job skips the suite when the PR touches nothing this pipeline builds.
  pull_request:
  push:
    branches: [main, "hotfix/**"] # hotfix/X.Y.x pushes publish vX.Y.Z-hotfix.N builds
    # What this pipeline builds and releases. A push of only docs, agent files,
    # or local docker compose never starts, so it never cuts a canary. Commits
    # from a skipped push are not lost: the next push that matches releases
    # everything since the last tag. Keep this list in step with `product` in
    # the changes job. A new packable root has to be added to both.
    # docs/ and docker/ are absent on purpose. scripts/ is included whole so a
    # new release script is picked up without editing this list.
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "templates/**"
      - "helm/**"
      - "scripts/**"
      - "Directory.*"
      - "global.json"
      - "NuGet.config"
      - ".editorconfig"
      - "*.slnx"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-*.yml"
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # sonar-build runs `begin` and sonar runs `end`: one version for both, or `end` breaks.
  SONAR_SCANNER_VERSION: 12.1.0
  # Where `begin` unpacks the .NET analyzer plugins (sonar.plugin.cache.directory; the default is a
  # temp dir). A fixed path, cached with ~/.sonar/cache (the JRE and the scanner engine) per version.
  SONAR_PLUGIN_CACHE: /home/runner/.sonar/plugin-cache

# Serialize runs per ref so two quick merges to main can't run overlapping
# releases. Cancel in-flight runs only for pull requests to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Elevated permissions live on the pipeline job (pipeline-pr runs read-only), plus `actions: write`
# on coverage-cleanup to delete this run's coverage and scanner state, and `actions: read` on sonar to
# list them. Test jobs run read-only.
permissions:
  contents: read

jobs:
  # Decides whether a pull request needs this pipeline. Skipped jobs count as
  # passing for required checks, which a workflow-level paths filter on
  # pull_request would not. Pushes, manual runs, and a file list this job cannot
  # read run everything — a push only reaches here when `paths` above already matched.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR's file list
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - name: 🔎 Classify the changed files
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          everything() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT" = "pull_request" ] || everything "Not a pull request: running everything."
          # A rename lists only its new path, so the old one is added: a file moved
          # out of src/ into docs/ still changes the build.
          files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') \
            || everything "Could not list the PR files: running everything."
          [ -n "$files" ] || everything "No files listed: running everything."
          # The endpoint stops at 3000 files without saying so; a longer list may be missing code.
          [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ] \
            || everything "3000 or more files (the API's limit): running everything."

          # Same set as `paths` on push. A file that matches runs the whole pipeline.
          product='^(src/|tests/|samples/|templates/|helm/|scripts/|Directory\.[^/]+$|global\.json$|NuGet\.config$|\.editorconfig$|[^/]*\.slnx$|\.github/workflows/ci\.yml$|\.github/workflows/release-[^/]+\.yml$)'
          code=false
          printf '%s\n' "$files" | grep -qE "$product" && code=true
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Changed files: $(printf '%s\n' "$files" | wc -l). Run pipeline: ${code}." >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: "Endatix API: Build & Test"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 📦 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      # Informational only — NuGetAudit + WarningsAsErrors(NU1903;NU1904) is the failing ratchet
      # (Directory.Build.props). This step surfaces the human-readable package list in the log.
      # It runs after a failed restore too (the case it exists for); restore still writes the
      # assets files. --no-restore: a second restore under CI=true fails the same way and
      # prints only the errors, never the table.
      - name: List vulnerable NuGet packages (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dotnet package list --project Endatix.slnx --no-restore --vulnerable --include-transitive
      - name: Build
        run: |
          dotnet build --no-restore 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: ⚠️ Check build warnings
        if: ${{ !cancelled() && hashFiles('build.log') != '' }}
        run: ./scripts/check-build-warnings.sh build.log
      - name: 🧪 Run unit tests
        run: |
          # Exit code 8 is the integration project, where this filter matches zero tests.
          # No --minimum-expected-tests here: it applies to each test app, and that one runs none.
          # --report-xunit-ctrf writes per-test durations for the summary step below; --show-slowest-tests and
          # --long-running print only when a test app runs on its own, never under dotnet test.
          dotnet test --no-build \
            --filter "FullyQualifiedName!~Endatix.IntegrationTests" \
            --ignore-exit-code 8 \
            --report-xunit-ctrf \
            --timeout 15m \
            --coverlet \
            --results-directory .coverage
      - name: ⏱️ Upload unit test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-unit
          path: .coverage/**/*.ctrf
          include-hidden-files: true # .coverage is a dot-directory
          if-no-files-found: warn
          retention-days: 7 # emitted: per-test detail for a recent run; the trend reads test-totals-*
      - name: ⏱️ Unit test durations summary
        if: ${{ !cancelled() }}
        run: node scripts/test-durations-summary.mjs .coverage "Unit test durations" --totals test-totals.json
      - name: ⏱️ Upload unit test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-unit
          path: test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted: the CI-speed trend (#1550) reads it across runs (~10 KB)
      - name: 📊 Upload unit coverage for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: .coverage/**/coverage.opencover.*.xml
          include-hidden-files: true # .coverage is a dot-directory
          if-no-files-found: error
          compression-level: 9 # XML: ~8% smaller than the default 6
          # Internal: only the sonar job of this run reads it, and coverage-cleanup deletes it once
          # sonar succeeds. Two days still covers re-running a failed sonar job.
          retention-days: 2
      - name: 📊 Install DotNet Report Generator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
      # Coveralls tracks unit coverage only, so its report leaves out the assemblies
      # that only integration tests reach. SonarCloud gets them (opencover above).
      - name: 📊 Merge Coverage Reports
        run: >-
          reportgenerator -reports:".coverage/**/coverage.cobertura.*.xml" -targetdir:".coverage/report"
          -reporttypes:"Cobertura;MarkdownSummaryGithub"
          -assemblyfilters:"-Endatix.Hosting;-Endatix.WebHost;-Endatix.Api.Host;-Endatix.Persistence.SqlServer;-Endatix.Persistence.PostgreSql"
      # Re-merge through dotnet-coverage as before: it writes branch="True", which
      # Coveralls ignores, so the Coveralls number stays line coverage as it has been.
      # Both tools are pinned because that depends on their exact behaviour.
      - name: Install DotNet Coverage
        run: dotnet tool install --global dotnet-coverage --version 18.12.0
      - name: 📊 Coveralls report
        run: dotnet-coverage merge .coverage/report/Cobertura.xml -f cobertura -o .coverage/merged.cobertura.xml
      # Coveralls closes a build after its one upload, and every attempt of a run shares the
      # run id as its build number, so a re-run gets its own build: <run id>-<attempt>.
      # The first attempt sends no build number and keeps the run id, as before.
      - name: 📊 Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          build-number: ${{ github.run_attempt != '1' && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
          format: cobertura
          file: .coverage/merged.cobertura.xml
          coverage-reporter-version: v0.6.22
      - name: 📝 Output Summary Report
        run: |
          echo ">[!NOTE] " >> $GITHUB_STEP_SUMMARY
          echo ">#### 🧪 Endatix API: Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo ">[![Coverage Status](https://coveralls.io/repos/github/endatix/endatix/badge.svg?branch=$BRANCH_NAME)](https://coveralls.io/github/endatix/endatix?branch=$BRANCH_NAME)" >> $GITHUB_STEP_SUMMARY
          cat .coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  # Each provider's suite runs as two lanes in parallel, each with its own database container.
  # A class joins the Jobs lane with [Trait("Lane", "Jobs")] (jobs, scheduler, outbox and
  # webhook-delivery classes); every other class runs in Rest. A few jobs classes run in Rest
  # to keep the SQL Server lanes even. See tests/README.md → Lanes.
  integration-tests:
    name: "Endatix API: ${{ matrix.title }} integration tests (${{ matrix.lane }})"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # min-tests: ~10% under each lane's count on 2026-11-10 (PostgreSQL 165 + 754 = 919,
        # SQL Server 163 + 780 = 943), so a filter that silently drops a whole area fails the
        # lane. A misspelled Lane trait moves its class to Rest without breaking the lane check;
        # the Jobs guard is what catches that. Raise them as the suite grows.
        include:
          - { provider: PostgreSql, title: PostgreSQL, lane: Jobs, artifact: integration-jobs, min-tests: 148 }
          - { provider: PostgreSql, title: PostgreSQL, lane: Rest, artifact: integration-rest, min-tests: 678 }
          - { provider: SqlServer, title: SQL Server, lane: Jobs, artifact: integration-sqlserver-jobs, min-tests: 146 }
          - { provider: SqlServer, title: SQL Server, lane: Rest, artifact: integration-sqlserver-rest, min-tests: 702 }
    env:
      ENDATIX_TEST_DB_PROVIDER: ${{ matrix.provider }}
      INTEGRATION_PROJECT: tests/Endatix.IntegrationTests/Endatix.IntegrationTests.csproj
      # The lane filters, in one place: the test step runs this lane's, the lane check runs both.
      JOBS_LANE_FILTER: Lane=Jobs
      REST_LANE_FILTER: Lane!=Jobs
      # Test collections run in parallel (tests/README.md, Collections), this many at once on the
      # 4-vCPU runner. Overrides maxParallelThreads in xunit.runner.json (also 3). Measured in #1661:
      # AudienceDirectoryFlowTests (~300 s) caps SQL Server Rest at any thread count; 2 slows the Jobs
      # lanes to the same ~330 s, and 3 keeps them well under Rest with a lower CPU peak than 4.
      INTEGRATION_MAX_THREADS: 3
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 📦 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # PRs skip P2 tests on PostgreSQL to save time, so SonarCloud can report code that only a
      # P2 test reaches as uncovered on a PR (covered again on main). Accepted trade-off.
      - name: Set integration test filter
        env:
          GITHUB_REF_SAFE: ${{ github.ref }}
          GITHUB_EVENT_NAME_SAFE: ${{ github.event_name }}
          LANE: ${{ matrix.lane }}
        run: |
          if [ "$ENDATIX_TEST_DB_PROVIDER" = "SqlServer" ]; then
            base="Category!=Keycloak&Category!=Performance&DbSpecific!=PostgreSql"
          elif [ "$GITHUB_REF_SAFE" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME_SAFE" != "pull_request" ]; then
            base="Category!=Keycloak&Category!=Performance&DbSpecific!=SqlServer"
          else
            base="Category!=Keycloak&Category!=Performance&Priority!=P2&DbSpecific!=SqlServer"
          fi
          if [ "$LANE" = "Jobs" ]; then lane="$JOBS_LANE_FILTER"; else lane="$REST_LANE_FILTER"; fi
          echo "INTEGRATION_BASE_FILTER=$base" >> "$GITHUB_ENV"
          echo "INTEGRATION_TEST_FILTER=$base&$lane" >> "$GITHUB_ENV"
      # Pulls the lane's database image and Ryuk while the build runs, so Testcontainers finds them
      # locally (its default pull policy is "missing"). The image is the ENDATIX_TEST_DB_*_IMAGE override
      # when set, else the Default*Image constant in EndatixTestcontainers.cs; the Ryuk tag is
      # Testcontainers 4.16's and needs bumping with it.
      # Best effort: a failed pull only warns, and Testcontainers pulls the image itself.
      - name: 🐳 Pull the database image
        id: pull-images
        background: true
        run: |
          if [ "$ENDATIX_TEST_DB_PROVIDER" = "SqlServer" ]; then image=$ENDATIX_TEST_DB_SQLSERVER_IMAGE; else image=$ENDATIX_TEST_DB_POSTGRES_IMAGE; fi
          [ -n "$image" ] || image=$(sed -n "s/.*Default${ENDATIX_TEST_DB_PROVIDER}Image = \"\(.*\)\";/\1/p" \
            tests/Endatix.IntegrationTests.Shared/EndatixTestcontainers.cs)
          [ -n "$image" ] || echo "::warning::No Default${ENDATIX_TEST_DB_PROVIDER}Image in EndatixTestcontainers.cs; Testcontainers will pull it."
          for i in $image testcontainers/ryuk:0.14.0; do
            start=$(date +%s)
            docker pull --quiet "$i" || echo "::warning::Could not pull $i; Testcontainers will pull it."
            echo "$i: $(( $(date +%s) - start )) s"
          done
      # Debug, like the unit run: Debug gives braces their own sequence points, so a
      # Release report would leave them 0-hit in the merged Sonar coverage.
      # No analyzers, code-style checks or NuGet audit here: the unit job builds the same projects
      # (Endatix.slnx) with all of them and fails on a vulnerable package, and the sonar job runs its
      # own analyzed build. Source generators still run, so the compiled code is the same.
      - name: Build integration tests
        run: dotnet build "$INTEGRATION_PROJECT" -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false -p:NuGetAudit=false
      # Lists tests only (seconds, no database): fails when a test is in neither lane or in both.
      - name: Check the lanes split the suite
        run: node scripts/check-integration-lanes.mjs "$INTEGRATION_PROJECT" "$INTEGRATION_BASE_FILTER" "$JOBS_LANE_FILTER" "$REST_LANE_FILTER"
      - name: ⏳ Wait for the image pull
        wait: [pull-images]
      - name: Run integration tests
        env:
          MIN_TESTS: ${{ matrix.min-tests }}
        # Samples CPU and memory every 5 s while the tests run (a 1 s vmstat window each) and prints them
        # after, to tune INTEGRATION_MAX_THREADS: CPU not idle % (I/O wait included), I/O wait %, run
        # queue, memory used on the runner (the database container included).
        run: |
          (while true; do
            echo "$(date +%T) $(vmstat 1 2 | awk 'END { printf "cpu %d%% wa %d%% runq %d", 100 - $15, $16, $1 }') mem $(free -m | awk '/^Mem:/ { print $3 }') MB"
            sleep 4
          done) > resources.log 2>&1 &
          sampler=$!
          status=0
          dotnet test "$INTEGRATION_PROJECT" \
            --no-build \
            --filter "$INTEGRATION_TEST_FILTER" \
            --minimum-expected-tests "$MIN_TESTS" \
            --max-threads "$INTEGRATION_MAX_THREADS" \
            --report-xunit-ctrf \
            --timeout 30m \
            --coverlet \
            --results-directory .coverage || status=$?
          kill "$sampler" 2>/dev/null || true
          echo "::group::CPU and memory every 5 s"
          cat resources.log
          echo "::endgroup::"
          awk '/ cpu / { gsub(/%/, ""); busy += $3; if ($3 > peak) peak = $3; if ($9 > mem) mem = $9; n++ }
            END { if (n) printf "CPU busy: mean %d%%, peak %d%%; memory used: peak %d MB (%d samples, %s threads)\n", busy / n, peak, mem, n, ENVIRON["INTEGRATION_MAX_THREADS"] }' resources.log
          exit "$status"
      - name: ⏱️ Upload integration test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-${{ matrix.artifact }}
          path: .coverage/**/*.ctrf
          include-hidden-files: true # .coverage is a dot-directory
          if-no-files-found: warn
          retention-days: 7 # emitted: per-test detail for a recent run; the trend reads test-totals-*
      - name: ⏱️ Integration test durations summary
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ matrix.title }} integration test durations (${{ matrix.lane }} lane)
        run: node scripts/test-durations-summary.mjs .coverage "$TITLE" --totals test-totals.json
      - name: ⏱️ Upload integration test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-${{ matrix.artifact }}
          path: test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted: the CI-speed trend (#1550) reads it across runs (~10 KB)
      - name: 📊 Upload integration coverage for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.artifact }}
          path: .coverage/**/coverage.opencover.*.xml
          include-hidden-files: true # .coverage is a dot-directory
          if-no-files-found: error
          compression-level: 9 # XML: ~8% smaller than the default 6
          retention-days: 2 # internal, as coverage-unit above

  # CI-based SonarCloud analysis with unit + PostgreSQL + SQL Server coverage (all four lanes).
  # Automatic Analysis (the SonarCloud app's own scan) cannot import coverage,
  # so it must be OFF in SonarCloud → Administration → Analysis Method.
  # The token comes from Infisical over OIDC, as in endatix-relay: `prod` on main,
  # `dev` everywhere else, so PR code never reaches release secrets. Production is
  # the environment the shared Infisical identity is bound to.
  # Fork and Dependabot PRs get no OIDC secrets: they skip the scan, with a notice.
  #
  # Two jobs, so the scanner's build runs alongside the tests (#1665): sonar-build runs `begin` and
  # the analyzed build and uploads the scanner state; sonar runs `end` once the coverage exists.
  # `end` finds that state only at the paths `begin` recorded, so both jobs use the same runner
  # image, the same checkout path and the same scanner version (SONAR_SCANNER_VERSION).
  # The JRE, engine and plugins `begin` downloads reach `end` through the Actions cache instead of the
  # artifact: sonar-build saves them under a key named after their file list, and sonar restores that
  # exact key. A new engine or JRE from SonarCloud gets a new key, so `end` never misses a path.
  # On PRs the save lands in the PR's scope only when main's entry does not match.
  sonar-build:
    name: "Endatix API: SonarCloud build"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04 # the same image as sonar: the scanner state holds absolute paths
    outputs:
      scanner-cache-key: ${{ steps.scanner-cache-key.outputs.key }}
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write # OIDC for Infisical, not repo write
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # git describe below reads the tags
          persist-credentials: false
      - name: 🔐 Fetch secrets (Infisical, OIDC)
        id: infisical
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          env-slug: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          # Only the one secret this job uses: the root folder also holds other repos' tokens,
          # and none of them may reach a job that builds PR code or the public scanner state.
          secret-name: ENDATIX_API_REPO_SONAR_TOKEN
      - name: ℹ️ No SonarCloud analysis on fork and Dependabot PRs
        if: steps.infisical.outcome == 'skipped'
        run: echo "::notice::SonarCloud analysis skipped - fork and Dependabot PRs get no Infisical secrets."
      - name: ❌ Require the SonarCloud token
        if: steps.infisical.outcome == 'success' && env.ENDATIX_API_REPO_SONAR_TOKEN == ''
        env:
          ENV_SLUG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          echo "::error::ENDATIX_API_REPO_SONAR_TOKEN is missing from the Infisical '$ENV_SLUG' environment (root folder)."
          exit 1
      - name: 📦 Setup .NET
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: 🔧 Install SonarScanner
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION"
      - name: ♻️ Restore the scanner cache
        id: scanner-cache
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sonar/cache
            ${{ env.SONAR_PLUGIN_CACHE }}
          key: sonar-${{ runner.os }}-${{ env.SONAR_SCANNER_VERSION }}-latest # never saved: restore-keys picks the newest
          restore-keys: sonar-${{ runner.os }}-${{ env.SONAR_SCANNER_VERSION }}-
      - name: 🔎 Begin
        # The coverage paths are read by `end` in the sonar job, which downloads the reports there.
        # These exclusions replace the ones set in the SonarCloud project; the cpd list
        # is the UI's plus Endpoints, which repeat FastEndpoints Configure() boilerplate
        # by the one-file-per-operation rule.
        # plsql:S1192 (repeated literals) is off for Scripts: each versioned SQL script is a
        # frozen copy of the last one, and its repeats are SurveyJS JSON keys, not magic values.
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        run: |
          # New code on main runs from the last stable release ("Previous version" in
          # SonarCloud); without /v: every analysis is "not provided" and it never resets.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          mkdir -p "$SONAR_PLUGIN_CACHE" "$HOME/.sonar/cache"
          dotnet-sonarscanner begin /k:"endatix_endatix" /o:"endatix" /v:"${tag#v}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$ENDATIX_API_REPO_SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths=".sonar-coverage/**/coverage.opencover.*.xml" \
            /d:sonar.exclusions="tests/**,**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Scripts/**,scripts/**,docs/**,samples/**" \
            /d:sonar.cpd.exclusions="tests/**,**/*Tests.cs,**/*Test.cs,**/Endatix.Persistence.*/**,**/Migrations/**,**/Endpoints/**" \
            /d:sonar.issue.ignore.multicriteria="sqlliterals" \
            /d:sonar.issue.ignore.multicriteria.sqlliterals.ruleKey="plsql:S1192" \
            /d:sonar.issue.ignore.multicriteria.sqlliterals.resourceKey="**/Scripts/**/*.sql" \
            /d:sonar.plugin.cache.directory="$SONAR_PLUGIN_CACHE"
      # A full build, as the scanner docs ask, so every project is compiled under the analyzers. Not
      # --disable-build-servers, which the docs also suggest: without the compiler server every project
      # starts a cold csc, and the build took 3:53 instead of 1:52 (#1667). No sonar.dotnet.excludeTestProjects: it removes every analyzer from the test
      # projects, source generators included, and their [GeneratedRegex] methods then fail (CS8795).
      - name: 🏗️ Build under the scanner
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        run: dotnet build --no-incremental
      # Named after the cache's file list (paths and sizes): the same downloads give the same key.
      - name: 🔑 Key the scanner cache
        id: scanner-cache-key
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        run: |
          list=$(find "$HOME/.sonar/cache" "$SONAR_PLUGIN_CACHE" -type f -not -path '*/_tmp/*' -printf '%p %s\n' | sort)
          echo "key=sonar-${RUNNER_OS}-${SONAR_SCANNER_VERSION}-$(printf '%s' "$list" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          du -sh "$HOME/.sonar/cache" "$SONAR_PLUGIN_CACHE"
      # begin and the build record absolute paths outside .sonarqube too: the sources the build
      # generated under obj/ (the JRE, engine and plugins come from the cache above). A tar keeps
      # them at those paths.
      - name: 📦 Pack the scanner state
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        run: |
          find "$PWD" -path '*/obj/*' -name '*.cs' > "$RUNNER_TEMP/obj-sources.txt"
          tar -cPzf sonar-scanner-state.tgz "$PWD/.sonarqube" -T "$RUNNER_TEMP/obj-sources.txt"
          ls -lh sonar-scanner-state.tgz
      # The repo is public, so its artifacts are too: the scanner keeps the token out of its state
      # (end takes it again), and this check holds it to that over exactly what is uploaded. The token
      # is the only secret in this job (secret-name above).
      # Fails closed: only grep's "no match" (1) lets the upload run, a read error (2) stops it.
      - name: 🔒 Check the scanner state and cache hold no token
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        run: |
          set +e +o pipefail
          tar -xOzf sonar-scanner-state.tgz | grep -qaF "$ENDATIX_API_REPO_SONAR_TOKEN"
          status=("${PIPESTATUS[@]}") # tar, grep
          if [ "${status[1]}" -eq 0 ]; then
            echo "::error::The SonarCloud token is in the scanner state; not uploading it."
            exit 1
          fi
          if [ "${status[0]}" -ne 0 ] || [ "${status[1]}" -ne 1 ]; then
            echo "::error::Could not check the scanner state for the token (tar ${status[0]}, grep ${status[1]}); not uploading it."
            exit 1
          fi
          # The cache is not public, but it is saved from a job that builds PR code: hold it to the same rule.
          grep -rqaF "$ENDATIX_API_REPO_SONAR_TOKEN" "$HOME/.sonar/cache" "$SONAR_PLUGIN_CACHE"
          found=$?
          if [ "$found" -ne 1 ]; then
            echo "::error::The SonarCloud token is in the scanner cache, or it could not be read (grep $found); not saving it."
            exit 1
          fi
          echo "No SonarCloud token in the scanner state or the scanner cache."
      - name: 💾 Save the scanner cache
        if: >-
          env.ENDATIX_API_REPO_SONAR_TOKEN != '' &&
          steps.scanner-cache.outputs.cache-matched-key != steps.scanner-cache-key.outputs.key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sonar/cache
            ${{ env.SONAR_PLUGIN_CACHE }}
          key: ${{ steps.scanner-cache-key.outputs.key }}
      - name: 📤 Upload the scanner state
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-scanner-state
          path: sonar-scanner-state.tgz
          compression-level: 0 # already gzipped
          if-no-files-found: error
          # Internal: only the sonar job of this run reads it, and coverage-cleanup deletes
          # it once sonar succeeds. After a red gate, a failed lane or a cancelled run it is kept for
          # this one day, so re-running the failed jobs still finds it, as the coverage is.
          retention-days: 1

  sonar:
    name: "Endatix API: SonarCloud" # also SONAR_JOB below, which finds an earlier attempt's result
    needs: [changes, unit-tests, integration-tests, sonar-build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04 # the same image as sonar-build
    environment:
      name: Production
    permissions:
      contents: read
      actions: read # list this run's artifacts and earlier attempts' jobs
      id-token: write # OIDC for Infisical, not repo write
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar needs history for new-code and blame
          persist-credentials: false
      - name: 🔐 Fetch secrets (Infisical, OIDC)
        id: infisical
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          env-slug: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          # Only the one secret this job uses: the root folder also holds other repos' tokens,
          # and none of them may reach a job that builds PR code or the public scanner state.
          secret-name: ENDATIX_API_REPO_SONAR_TOKEN
      - name: ℹ️ No SonarCloud analysis on fork and Dependabot PRs
        if: steps.infisical.outcome == 'skipped'
        run: echo "::notice::SonarCloud analysis skipped - fork and Dependabot PRs get no Infisical secrets."
      - name: ❌ Require the SonarCloud token
        if: steps.infisical.outcome == 'success' && env.ENDATIX_API_REPO_SONAR_TOKEN == ''
        env:
          ENV_SLUG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          echo "::error::ENDATIX_API_REPO_SONAR_TOKEN is missing from the Infisical '$ENV_SLUG' environment (root folder)."
          exit 1
      # Reads the run's artifact list, not the downloaded folders: every lane's coverage and the
      # scanner state must be there, or nothing is analyzed. When an earlier attempt already passed
      # for this commit and its cleanup deleted them (a one-job re-run), the analysis is skipped.
      - name: 📋 Check the analysis inputs
        id: inputs
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_JOB: "Endatix API: SonarCloud" # this job's `name:`; keep the two in step
        # Every coverage upload above, unit and the four integration lanes (matrix `artifact`): a new
        # lane goes here too, or its coverage could be missing from an analysis.
        run: >-
          node scripts/check-sonar-inputs.mjs coverage-unit coverage-integration-jobs coverage-integration-rest
          coverage-integration-sqlserver-jobs coverage-integration-sqlserver-rest sonar-scanner-state
      - name: 📦 Setup .NET
        if: steps.inputs.outputs.analyze == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: 📊 Download coverage
        if: steps.inputs.outputs.analyze == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: .sonar-coverage
      - name: 📥 Download the scanner state
        if: steps.inputs.outputs.analyze == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-scanner-state
          path: ${{ runner.temp }}
      - name: 📦 Unpack the scanner state
        if: steps.inputs.outputs.analyze == 'true'
        run: tar -xPzf "$RUNNER_TEMP/sonar-scanner-state.tgz"
      # The exact entry sonar-build saved or matched: the JRE and engine paths `begin` recorded.
      - name: ♻️ Restore the scanner cache
        if: steps.inputs.outputs.analyze == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sonar/cache
            ${{ env.SONAR_PLUGIN_CACHE }}
          key: ${{ needs.sonar-build.outputs.scanner-cache-key }}
          fail-on-cache-miss: true
      - name: 🔧 Install SonarScanner
        if: steps.inputs.outputs.analyze == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION"
      - name: 🔎 Analyze
        # The gate is read in the next step, not here (no sonar.qualitygate.wait).
        if: steps.inputs.outputs.analyze == 'true'
        run: dotnet-sonarscanner end /d:sonar.token="$ENDATIX_API_REPO_SONAR_TOKEN"
      - name: 🚦 Quality gate
        # SonarCloud Free can't edit "Sonar way", so we read its verdict ourselves.
        # PRs: every red condition fails the job except the metrics in
        # SONAR_ADVISORY_METRICS (duplication), which only warn. Pushes (main, hotfix):
        # report only (`*`); the code is already merged. See AGENTS.md → Sonar gate.
        if: steps.inputs.outputs.analyze == 'true'
        env:
          SONAR_TOKEN: ${{ env.ENDATIX_API_REPO_SONAR_TOKEN }}
          SONAR_ADVISORY_METRICS: ${{ github.event_name == 'pull_request' && 'new_duplicated_lines_density' || '*' }}
        run: node scripts/sonar-gate.mjs

  # Coverage and the scanner state are internal to this run: delete them once SonarCloud has read
  # them. Never after a failed sonar job, so re-running it still finds them. A separate job, so the
  # token that can delete artifacts never reaches a job that builds PR code. Fork and Dependabot PRs
  # get a read-only token whatever `permissions` says; their coverage just expires.
  coverage-cleanup:
    name: "Endatix API: Delete consumed coverage"
    needs: [sonar]
    if: >-
      needs.sonar.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: write # delete this run's artifacts
    steps:
      - name: 🧹 Delete this run's coverage and scanner state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            -q '.artifacts[] | select((.name | startswith("coverage-")) or .name == "sonar-scanner-state") | .id') \
            || { echo "::warning::Could not list this run's artifacts; they expire in 1-2 days."; exit 0; }
          if [ -z "$ids" ]; then
            echo "::warning::No coverage or scanner state found on this run; nothing deleted."
            exit 0
          fi
          # Housekeeping only: a failed delete warns, and the 1-2 day retention removes it anyway.
          deleted=0
          for id in $ids; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id"; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete artifact $id; it expires in 1-2 days."
            fi
          done
          echo "Deleted $deleted of $(printf '%s\n' "$ids" | wc -l) coverage and scanner-state artifacts." | tee -a "$GITHUB_STEP_SUMMARY"

  # Build validation on PRs; canary release on main — publishes only after ALL
  # tests above pass. docker-image makes the shared workflow log into GHCR and
  # export DOCKER_IMAGE to the release scripts; canaries stay on GHCR only.
  # Promoted releases mirror to Docker Hub — both stable AND maintenance (an
  # older line's hotfix still ships publicly); only stable moves the `latest`
  # tag, so a maintenance release never drags it backwards (release-publish.sh).
  # No secrets are passed: the shared workflow uses the implicit GITHUB_TOKEN
  # and fetches everything else via Infisical (OIDC, hence id-token).
  #
  # Two callers, because `needs:` cannot depend on the event. On a pull request the shared
  # workflow only runs release-prepare.sh @ 0.0.0-ci: it publishes nothing, so it runs alongside
  # the tests (pipeline-pr). Every other event, pushes to main and hotfix/** included, waits for
  # every test job (pipeline). Both are named Pipeline, so the check reads the same.
  pipeline-pr:
    name: Pipeline
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      # Build validation only: at the pinned SHA canary.yml logs in, fetches secrets and publishes on
      # main and hotfix/* only. A bump that needs more on PRs fails this job at startup; grant it then.
      contents: read
    uses: endatix/release-workflows/.github/workflows/canary.yml@d0f1bfc9325d6ad5588e91f49885b02eadaae6d7 # v1
    with:
      docker-image: ghcr.io/endatix/endatix-api
      dotnet-version: "10.x" # global.json rolls forward within 10.0.x

  pipeline:
    name: Pipeline
    needs: [changes, unit-tests, integration-tests]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read # release writes use the App token inside the shared workflow
      packages: write # GitHub Packages push + GHCR image push
      id-token: write # OIDC for Infisical inside the shared workflow
    uses: endatix/release-workflows/.github/workflows/canary.yml@d0f1bfc9325d6ad5588e91f49885b02eadaae6d7 # v1
    with:
      docker-image: ghcr.io/endatix/endatix-api
      dotnet-version: "10.x" # global.json rolls forward within 10.0.x
