name: Build, Test & Release

# Thin consumer of endatix/release-workflows (see its README):
#   • a PR that touches the product paths below → tests + SonarCloud + build
#     validation in the shared pipeline
#     (scripts/release-prepare.sh @ 0.0.0-ci — builds + packs, publishes nothing).
#     A docs-only PR skips those jobs; the checks still pass.
#   • push main, same paths → tests, then canary vX.Y.Z-canary.N: semantic-release builds
#     once at the real version and publishes the NuGet packages to GitHub
#     Packages (canaries NEVER go to nuget.org — it is public and immutable).
#   • stable releases → MANUAL, human-reviewed: run "Start Stable Release"
#     (release-start.yml) → edit the draft notes → click "Publish release" →
#     release-artifacts.yml rebuilds at the tag and publishes to GitHub
#     Packages + nuget.org.
#
# The canary publishes ONLY after unit + integration tests pass (needs: below).
# Repo-specific release logic lives in scripts/release-prepare.sh and
# scripts/release-publish.sh (the consumer contract), plus the dormant `stable`
# branch required by semantic-release's branch validation.

on:
  # Every PR, stacked ones included (base = another feature branch). No paths
  # filter here: a workflow that does not start leaves required checks pending.
  # The changes job skips the suite when the PR touches nothing this pipeline builds.
  pull_request:
  push:
    branches: [main, "hotfix/**"] # hotfix/X.Y.x pushes publish vX.Y.Z-hotfix.N builds
    # What this pipeline builds and releases. A push of only docs, agent files,
    # or local docker compose never starts, so it never cuts a canary. Commits
    # from a skipped push are not lost: the next push that matches releases
    # everything since the last tag. Keep this list in step with `product` in
    # the changes job. A new packable root has to be added to both.
    # docs/ and docker/ are absent on purpose. scripts/ is included whole so a
    # new release script is picked up without editing this list.
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "templates/**"
      - "helm/**"
      - "scripts/**"
      - "Directory.*"
      - "global.json"
      - "NuGet.config"
      - ".editorconfig"
      - "*.slnx"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-*.yml"
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Serialize runs per ref so two quick merges to main can't run overlapping
# releases. Cancel in-flight runs only for pull requests to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Elevated permissions live on the pipeline job; the test job gets only `id-token: write` for
# the SonarCloud token — it never writes to the repo.
permissions:
  contents: read

jobs:
  # Decides whether a pull request needs this pipeline. Skipped jobs count as
  # passing for required checks, which a workflow-level paths filter on
  # pull_request would not. Pushes, manual runs, and a file list this job cannot
  # read run everything — a push only reaches here when `paths` above already matched.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR's file list
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - name: 🔎 Classify the changed files
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          everything() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT" = "pull_request" ] || everything "Not a pull request: running everything."
          # A rename lists only its new path, so the old one is added: a file moved
          # out of src/ into docs/ still changes the build.
          files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') \
            || everything "Could not list the PR files: running everything."
          [ -n "$files" ] || everything "No files listed: running everything."
          # The endpoint stops at 3000 files without saying so; a longer list may be missing code.
          [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ] \
            || everything "3000 or more files (the API's limit): running everything."

          # Same set as `paths` on push. A file that matches runs the whole pipeline.
          product='^(src/|tests/|samples/|templates/|helm/|scripts/|Directory\.[^/]+$|global\.json$|NuGet\.config$|\.editorconfig$|[^/]*\.slnx$|\.github/workflows/ci\.yml$|\.github/workflows/release-[^/]+\.yml$)'
          code=false
          printf '%s\n' "$files" | grep -qE "$product" && code=true
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Changed files: $(printf '%s\n' "$files" | wc -l). Run pipeline: ${code}." >> "$GITHUB_STEP_SUMMARY"

  # One job builds once (under the SonarCloud scanner when the token exists), then runs the unit tests
  # and the four integration lanes as parallel background steps, then SonarCloud reads the coverage
  # from disk. Each lane runs from its own copy of the integration test app: coverlet.MTP instruments
  # the DLLs next to the app in place, so lanes running at the same time can't share one bin folder.
  # Each lane starts its own database container (Testcontainers names them per process).
  # A class joins the Jobs lane with [Trait("Lane", "Jobs")]; every other class runs in Rest.
  # See tests/README.md → Lanes.
  #
  # The SonarCloud token comes from Infisical over OIDC, as in endatix-relay: `prod` on main,
  # `dev` everywhere else, so PR code never reaches release secrets. Production is the
  # environment the shared Infisical identity is bound to. Fork and Dependabot PRs get no OIDC
  # secrets: they build and test without the scan, with a notice.
  # Automatic Analysis (the SonarCloud app's own scan) cannot import coverage, so it must be OFF
  # in SonarCloud → Administration → Analysis Method.
  build-and-test:
    name: "Endatix API: Build, Test & Analyze"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write # OIDC for Infisical, not repo write
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      INTEGRATION_PROJECT: tests/Endatix.IntegrationTests/Endatix.IntegrationTests.csproj
      INTEGRATION_OUTPUT: tests/Endatix.IntegrationTests/bin/Debug/net10.0
      # The lane filters, in one place: each lane runs its own, the lane check runs both.
      JOBS_LANE_FILTER: Lane=Jobs
      REST_LANE_FILTER: Lane!=Jobs
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar needs history for new-code and blame
          persist-credentials: false
      - name: 🔐 Fetch secrets (Infisical, OIDC)
        id: infisical
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          env-slug: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          # Root folder only (no recursive): keeps folders such as the GitHub App
          # credentials out of a job that builds PR code.
      - name: ℹ️ No SonarCloud analysis on fork and Dependabot PRs
        if: steps.infisical.outcome == 'skipped'
        run: echo "::notice::SonarCloud analysis skipped - fork and Dependabot PRs get no Infisical secrets."
      - name: ❌ Require the SonarCloud token
        if: steps.infisical.outcome == 'success' && env.ENDATIX_API_REPO_SONAR_TOKEN == ''
        env:
          ENV_SLUG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          echo "::error::ENDATIX_API_REPO_SONAR_TOKEN is missing from the Infisical '$ENV_SLUG' environment (root folder)."
          exit 1
      - name: 📦 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      # Informational only — NuGetAudit + WarningsAsErrors(NU1903;NU1904) is the failing ratchet
      # (Directory.Build.props). This step surfaces the human-readable package list in the log.
      # It runs after a failed restore too (the case it exists for); restore still writes the
      # assets files. --no-restore: a second restore under CI=true fails the same way and
      # prints only the errors, never the table.
      - name: List vulnerable NuGet packages (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dotnet package list --project Endatix.slnx --no-restore --vulnerable --include-transitive
      # PRs skip P2 tests on PostgreSQL to save time, so SonarCloud can report code that only a
      # P2 test reaches as uncovered on a PR (covered again on main). Accepted trade-off.
      - name: Set integration test filters
        env:
          GITHUB_REF_SAFE: ${{ github.ref }}
          GITHUB_EVENT_NAME_SAFE: ${{ github.event_name }}
        run: |
          echo "SQLSERVER_BASE_FILTER=Category!=Keycloak&Category!=Performance&DbSpecific!=PostgreSql" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_SAFE" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME_SAFE" != "pull_request" ]; then
            echo "POSTGRES_BASE_FILTER=Category!=Keycloak&Category!=Performance&DbSpecific!=SqlServer" >> "$GITHUB_ENV"
          else
            echo "POSTGRES_BASE_FILTER=Category!=Keycloak&Category!=Performance&Priority!=P2&DbSpecific!=SqlServer" >> "$GITHUB_ENV"
          fi
      # Pushes keep going without SonarCloud, so an outage there never blocks the canary.
      - name: 🔎 Begin SonarCloud analysis
        # These exclusions replace the ones set in the SonarCloud project; the cpd list
        # is the UI's plus Endpoints, which repeat FastEndpoints Configure() boilerplate
        # by the one-file-per-operation rule.
        # plsql:S1192 (repeated literals) is off for Scripts: each versioned SQL script is a
        # frozen copy of the last one, and its repeats are SurveyJS JSON keys, not magic values.
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          # New code on main runs from the last stable release ("Previous version" in
          # SonarCloud); without /v: every analysis is "not provided" and it never resets.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          dotnet-sonarscanner begin /k:"endatix_endatix" /o:"endatix" /v:"${tag#v}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$ENDATIX_API_REPO_SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths=".coverage/**/coverage.opencover.*.xml" \
            /d:sonar.exclusions="tests/**,**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Scripts/**,scripts/**,docs/**,samples/**" \
            /d:sonar.cpd.exclusions="tests/**,**/*Tests.cs,**/*Test.cs,**/Endatix.Persistence.*/**,**/Migrations/**,**/Endpoints/**" \
            /d:sonar.issue.ignore.multicriteria="sqlliterals" \
            /d:sonar.issue.ignore.multicriteria.sqlliterals.ruleKey="plsql:S1192" \
            /d:sonar.issue.ignore.multicriteria.sqlliterals.resourceKey="**/Scripts/**/*.sql"
      # Debug, as before: Debug gives braces their own sequence points, so a Release report
      # would leave them 0-hit in the merged Sonar coverage.
      - name: Build
        run: dotnet build --no-restore
      # Lists tests only (seconds, no database): fails when a test is in neither lane or in both.
      - name: Check the lanes split the suite
        run: |
          node scripts/check-integration-lanes.mjs "$INTEGRATION_PROJECT" "$POSTGRES_BASE_FILTER" "$JOBS_LANE_FILTER" "$REST_LANE_FILTER"
          node scripts/check-integration-lanes.mjs "$INTEGRATION_PROJECT" "$SQLSERVER_BASE_FILTER" "$JOBS_LANE_FILTER" "$REST_LANE_FILTER"
      - name: Copy the integration test app for each lane
        run: |
          for lane in integration-jobs integration-rest integration-sqlserver-jobs integration-sqlserver-rest; do
            mkdir -p "$RUNNER_TEMP/lanes"
            cp -a "$INTEGRATION_OUTPUT" "$RUNNER_TEMP/lanes/$lane"
          done
      # Spike (#1550 3e): samples memory, CPU and containers every 5 s, outside the background steps.
      - name: 📈 Start the pressure sampler
        run: |
          cat > "$RUNNER_TEMP/sampler.sh" <<'EOF'
          while true; do
            t=$(date +%s)
            mem=$(awk '/MemTotal/{t=$2}/MemAvailable/{a=$2}/SwapTotal/{st=$2}/SwapFree/{sf=$2}END{printf "avail_mb=%d used_mb=%d swap_used_mb=%d", a/1024, (t-a)/1024, (st-sf)/1024}' /proc/meminfo)
            cpu=$(vmstat 1 2 | tail -1 | awk '{printf "run=%s us=%s sy=%s id=%s wa=%s si=%s so=%s", $1, $13, $14, $15, $16, $7, $8}')
            dn=$(ps -C dotnet -o rss= | awk '{s+=$1}END{printf "dotnet_rss_mb=%d", s/1024}')
            echo "$t $mem $cpu $dn load1=$(cut -d' ' -f1 /proc/loadavg)"
            if [ $((t % 20)) -lt 5 ]; then
              docker stats --no-stream --format "$t container {{.Name}} {{.MemUsage}} {{.CPUPerc}}" 2>/dev/null
            fi
            sleep 4
          done
          EOF
          nohup bash "$RUNNER_TEMP/sampler.sh" > "$RUNNER_TEMP/pressure.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"
          nproc; free -m; swapon --show || true
      - name: 🧪 Unit tests
        id: unit
        background: true
        run: |
          start=$(date +%s)
          status=0
          # Exit code 8 is the integration project, where this filter matches zero tests.
          # No --minimum-expected-tests here: it applies to each test app, and that one runs none.
          dotnet test --no-build \
            --filter "FullyQualifiedName!~Endatix.IntegrationTests" \
            --ignore-exit-code 8 \
            --report-xunit-ctrf \
            --timeout 15m \
            --coverlet \
            --results-directory .coverage/unit || status=$?
          echo "::notice title=unit::$(( $(date +%s) - start )) s, exit $status (started $start)"
          exit $status
      # min-tests: ~10% under each lane's count on 2026-11-10 (PostgreSQL 165 + 754 = 919,
      # SQL Server 163 + 780 = 943), so a filter that silently drops a whole area fails the
      # lane. A misspelled Lane trait moves its class to Rest without breaking the lane check;
      # the Jobs guard is what catches that. Raise them as the suite grows.
      - name: 🧪 PostgreSQL integration tests (Jobs)
        id: pg-jobs
        background: true
        run: scripts/run-integration-lane.sh integration-jobs PostgreSql "$POSTGRES_BASE_FILTER&$JOBS_LANE_FILTER" 148
      - name: 🧪 PostgreSQL integration tests (Rest)
        id: pg-rest
        background: true
        run: scripts/run-integration-lane.sh integration-rest PostgreSql "$POSTGRES_BASE_FILTER&$REST_LANE_FILTER" 678
      - name: 🧪 SQL Server integration tests (Jobs)
        id: sql-jobs
        background: true
        run: scripts/run-integration-lane.sh integration-sqlserver-jobs SqlServer "$SQLSERVER_BASE_FILTER&$JOBS_LANE_FILTER" 146
      - name: 🧪 SQL Server integration tests (Rest)
        id: sql-rest
        background: true
        run: scripts/run-integration-lane.sh integration-sqlserver-rest SqlServer "$SQLSERVER_BASE_FILTER&$REST_LANE_FILTER" 702
      - name: ⏳ Wait for the test steps
        wait: [unit, pg-jobs, pg-rest, sql-jobs, sql-rest]
      - name: 📈 Stop the pressure sampler
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/sampler.pid")" 2>/dev/null || true
          log="$RUNNER_TEMP/pressure.log"
          awk '$2 ~ /^avail_mb=/ {
                 split($2,a,"="); split($4,s,"="); split($6,u,"="); split($7,y,"="); split($9,w,"="); split($12,d,"="); split($13,l,"=")
                 n++; if (min=="" || a[2]<min) min=a[2]; if (s[2]>swap) swap=s[2]; if (d[2]>rss) rss=d[2]; if (l[2]>load) load=l[2]
                 busy+=u[2]+y[2]; wa+=w[2]; if (u[2]+y[2]>=95) sat++
               }
               END { printf "Pressure: %d samples, min MemAvailable %d MB, max swap used %d MB, max dotnet RSS %d MB, max load1 %s, mean CPU busy %.0f%%, mean iowait %.0f%%, samples >=95%% busy %d\n", n, min, swap, rss, load, busy/n, wa/n, sat }' "$log" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- raw samples ---"
          cat "$log"
      - name: ⏱️ Test durations summaries
        if: ${{ !cancelled() }}
        run: |
          summarize() { node scripts/test-durations-summary.mjs ".coverage/$1" "$2" --totals "$RUNNER_TEMP/totals/$1/test-totals.json"; }
          mkdir -p "$RUNNER_TEMP"/totals/{unit,integration-jobs,integration-rest,integration-sqlserver-jobs,integration-sqlserver-rest}
          summarize unit "Unit test durations"
          summarize integration-jobs "PostgreSQL integration test durations (Jobs lane)"
          summarize integration-rest "PostgreSQL integration test durations (Rest lane)"
          summarize integration-sqlserver-jobs "SQL Server integration test durations (Jobs lane)"
          summarize integration-sqlserver-rest "SQL Server integration test durations (Rest lane)"
      - name: ⏱️ Upload unit test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-unit
          path: .coverage/unit/**/*.ctrf
          include-hidden-files: true # .coverage is a dot-directory
          if-no-files-found: warn
          retention-days: 7 # emitted: per-test detail for a recent run; the trend reads test-totals-*
      - name: ⏱️ Upload PostgreSQL Jobs test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-integration-jobs
          path: .coverage/integration-jobs/**/*.ctrf
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7 # emitted, as test-durations-unit
      - name: ⏱️ Upload PostgreSQL Rest test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-integration-rest
          path: .coverage/integration-rest/**/*.ctrf
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7 # emitted, as test-durations-unit
      - name: ⏱️ Upload SQL Server Jobs test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-integration-sqlserver-jobs
          path: .coverage/integration-sqlserver-jobs/**/*.ctrf
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7 # emitted, as test-durations-unit
      - name: ⏱️ Upload SQL Server Rest test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-integration-sqlserver-rest
          path: .coverage/integration-sqlserver-rest/**/*.ctrf
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7 # emitted, as test-durations-unit
      - name: ⏱️ Upload unit test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-unit
          path: ${{ runner.temp }}/totals/unit/test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted: the CI-speed trend (#1550) reads it across runs (~10 KB)
      - name: ⏱️ Upload PostgreSQL Jobs test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-integration-jobs
          path: ${{ runner.temp }}/totals/integration-jobs/test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted, as test-totals-unit
      - name: ⏱️ Upload PostgreSQL Rest test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-integration-rest
          path: ${{ runner.temp }}/totals/integration-rest/test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted, as test-totals-unit
      - name: ⏱️ Upload SQL Server Jobs test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-integration-sqlserver-jobs
          path: ${{ runner.temp }}/totals/integration-sqlserver-jobs/test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted, as test-totals-unit
      - name: ⏱️ Upload SQL Server Rest test totals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-totals-integration-sqlserver-rest
          path: ${{ runner.temp }}/totals/integration-sqlserver-rest/test-totals.json
          if-no-files-found: warn
          retention-days: 90 # emitted, as test-totals-unit
      # SonarCloud reads the coverage of all five test steps from disk, so no coverage artifact.
      # It runs while the Coveralls report is merged below.
      - name: 🔎 End SonarCloud analysis
        id: sonar-end
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != ''
        background: true
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          start=$(date +%s)
          dotnet-sonarscanner end /d:sonar.token="$ENDATIX_API_REPO_SONAR_TOKEN"
          echo "::notice title=sonar-end::$(( $(date +%s) - start )) s"
      - name: 📊 Install DotNet Report Generator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
      # Coveralls tracks unit coverage only, so its report leaves out the assemblies
      # that only integration tests reach. SonarCloud gets them (opencover above).
      - name: 📊 Merge Coverage Reports
        run: >-
          reportgenerator -reports:".coverage/unit/**/coverage.cobertura.*.xml" -targetdir:".coverage/unit/report"
          -reporttypes:"Cobertura;MarkdownSummaryGithub"
          -assemblyfilters:"-Endatix.Hosting;-Endatix.WebHost;-Endatix.Api.Host;-Endatix.Persistence.SqlServer;-Endatix.Persistence.PostgreSql"
      # Re-merge through dotnet-coverage as before: it writes branch="True", which
      # Coveralls ignores, so the Coveralls number stays line coverage as it has been.
      # Both tools are pinned because that depends on their exact behaviour.
      - name: Install DotNet Coverage
        run: dotnet tool install --global dotnet-coverage --version 18.12.0
      - name: 📊 Coveralls report
        run: dotnet-coverage merge .coverage/unit/report/Cobertura.xml -f cobertura -o .coverage/unit/merged.cobertura.xml
      - name: 📊 Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          format: cobertura
          file: .coverage/unit/merged.cobertura.xml
          coverage-reporter-version: v0.6.22
      - name: 📝 Output Summary Report
        run: |
          echo ">[!NOTE] " >> $GITHUB_STEP_SUMMARY
          echo ">#### 🧪 Endatix API: Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo ">[![Coverage Status](https://coveralls.io/repos/github/endatix/endatix/badge.svg?branch=$BRANCH_NAME)](https://coveralls.io/github/endatix/endatix?branch=$BRANCH_NAME)" >> $GITHUB_STEP_SUMMARY
          cat .coverage/unit/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      - name: ⏳ Wait for SonarCloud
        wait: sonar-end
      - name: 🚦 Quality gate
        # SonarCloud Free can't edit "Sonar way", so we read its verdict ourselves.
        # PRs: every red condition fails the job except the metrics in
        # SONAR_ADVISORY_METRICS (duplication), which only warn. Pushes (main, hotfix):
        # report only (`*`); the code is already merged. See AGENTS.md → Sonar gate.
        if: env.ENDATIX_API_REPO_SONAR_TOKEN != '' && steps.sonar-end.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ env.ENDATIX_API_REPO_SONAR_TOKEN }}
          SONAR_ADVISORY_METRICS: ${{ github.event_name == 'pull_request' && 'new_duplicated_lines_density' || '*' }}
        run: node scripts/sonar-gate.mjs

  # Build validation on PRs; canary release on main — publishes only after ALL
  # tests above pass. docker-image makes the shared workflow log into GHCR and
  # export DOCKER_IMAGE to the release scripts; canaries stay on GHCR only.
  # Promoted releases mirror to Docker Hub — both stable AND maintenance (an
  # older line's hotfix still ships publicly); only stable moves the `latest`
  # tag, so a maintenance release never drags it backwards (release-publish.sh).
  # No secrets are passed: the shared workflow uses the implicit GITHUB_TOKEN
  # and fetches everything else via Infisical (OIDC, hence id-token).
  pipeline:
    name: Pipeline
    needs: [changes, build-and-test]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read # release writes use the App token inside the shared workflow
      packages: write # GitHub Packages push + GHCR image push
      id-token: write # OIDC for Infisical inside the shared workflow
    uses: endatix/release-workflows/.github/workflows/canary.yml@d0f1bfc9325d6ad5588e91f49885b02eadaae6d7 # v1
    with:
      docker-image: ghcr.io/endatix/endatix-api
      dotnet-version: "10.x" # global.json rolls forward within 10.0.x
