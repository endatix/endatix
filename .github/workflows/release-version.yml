# Write the release version into Directory.Build.props, then stop.
#
# The commit this pushes is what a human tags (`v` + the version) and publishes.
# The workflow does not create the tag: tagging here would publish a release
# before the notes are reviewed. NuGet packs and a later npm publish both read
# this file. Do not also pass -p:Version.
#
# Push uses the App token. A GITHUB_TOKEN push does not start later workflows.
name: Prepare release version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v (e.g. 0.7.7-canary.44)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  bump:
    name: Set Directory.Build.props Version to ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: 🔐 Fetch secrets (Infisical, OIDC)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          recursive: true

      - name: 🔑 Endatix Automations APP token (this repository)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.ENDATIX_PROJECT_AUTOMATIONS_APP_ID }}
          private-key: ${{ env.ENDATIX_PROJECT_AUTOMATIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: 🔍 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: ✅ Validate the version
        run: |
          v="${VERSION#v}"
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a version number"
            exit 1
          fi
          echo "PIN=$v" >> "$GITHUB_ENV"

      - name: 📌 Set Directory.Build.props Version
        run: |
          f=Directory.Build.props
          live=$(sed 's/<!--.*-->//g' "$f" \
            | grep -nE '<Version[^>]*>[^<]*</Version>' | cut -d: -f1)
          count=$(printf '%s' "$live" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::${f} sets Version ${count} times; expected exactly one"
            exit 1
          fi
          sed -i -E "${live}s|(<Version[^>]*>)[^<]*(</Version>)|\1${PIN}\2|" "$f"
          grep -n "<Version" "$f"

      - name: 📝 Commit
        run: |
          if git diff --quiet -- Directory.Build.props; then
            echo "Version is already \`${PIN}\`; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: release ${PIN}" -- Directory.Build.props
          for attempt in 1 2 3; do
            if ! git pull --rebase --quiet origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "::error::rebase onto main failed — nothing was pushed"
              exit 1
            fi
            if git push --quiet origin HEAD:main; then
              echo "Set Version to \`${PIN}\` on main (attempt ${attempt}/3). Tag that commit \`v${PIN}\` when the notes are ready." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep "$((attempt * 3))"
          done
          echo "::error::could not push to main after 3 attempts"
          exit 1
