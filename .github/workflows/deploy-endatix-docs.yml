name: Deploy Endatix Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/endatix-docs/**/*"
  workflow_dispatch:

jobs:
  deploy-endatix-docs:
    # CodeQL actions/missing-workflow-permissions (#2): checkout + cache only need read.
    # Azure deploy uses DOCS_DEPLOYMENT_TOKEN; GITHUB_TOKEN is repo_token for status only.
    permissions:
      contents: read
    env:
      STORE_PATH: ""
    runs-on: ubuntu-latest
    environment:
      name: Production
    defaults:
      run:
        working-directory: ./docs/endatix-docs

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Non-EOL LTS, at or above the 22.13 floor the docs advertise and the
          # docs site's own engines.node. See https://nodejs.org/en/about/eol.
          node-version: "22.23.2"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 🥡 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Project
        run: pnpm run build
        env:
          ALGOLIA_APP_ID: ${{ secrets.DOCS_ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.DOCS_ALGOLIA_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ vars.DOCS_ALGOLIA_INDEX_NAME }}

      - name: 🔗 Copy Url Rewrites to the build folder
        run: cp staticwebapp.config.json ./build/

      - name: 🚡 Deploy to Static Web App
        id: deploy-to-static-web-app
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.DOCS_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: "./docs/endatix-docs/build/"
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          api_location: ''

      - name: 📡 Submit changed URLs to IndexNow
        run: pnpm indexnow
        continue-on-error: true

      - name: Summary message
        run: |
          echo ">[!TIP] " >> $GITHUB_STEP_SUMMARY
          echo "> ### Job Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo ">check site at https://docs.endatix.com/" >> $GITHUB_STEP_SUMMARY

  close_pull_request_job:
    # Dead under current triggers (push/workflow_dispatch only); keep for Azure SWA
    # close action. CodeQL (#4): no GITHUB_TOKEN scopes required.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions: {}
    runs-on: ubuntu-latest
    name: Close PR Job
    environment:
      name: Production
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.DOCS_DEPLOYMENT_TOKEN }}
          app_location: ''
          action: 'close'
