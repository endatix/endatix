version: 2
updates:
  # Keeps GitHub Actions references (including the SHA-pinned
  # endatix/release-workflows reusable workflows) up to date via PRs.
  # "/" covers .github/workflows; composite actions are not scanned unless listed
  # (this repo has none under .github/actions yet).
  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # NuGet via Central Package Management (Directory.Packages.props at repo root).
  # Without this entry, NuGet vulns only surface as NU190x build warnings — Dependabot
  # never opened version PRs for the .NET graph.
  - package-ecosystem: nuget
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    # Hold version updates for two days so a release that gets yanked or
    # compromised soon after publishing is never proposed (security updates skip this).
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # FluentAssertions 8+ is under a commercial license; stay on 7.x.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-runtime:
        applies-to: version-updates
        # Majors (a new .NET) come as their own PRs, not inside this group.
        update-types: ["minor", "patch"]
        patterns:
          - "Microsoft.*"
          - "System.*"
        # Versioned independently of the runtime, or test tooling (see test-deps).
        exclude-patterns:
          - "Microsoft.ApplicationInsights*"
          - "Microsoft.FeatureManagement*"
          - "Microsoft.Data.SqlClient"
      test-deps:
        applies-to: version-updates
        patterns:
          - "xunit*"
          - "NSubstitute*"
          - "FluentAssertions*"
          - "Testcontainers*"
          - "coverlet*"
      analyzers-sonar:
        applies-to: version-updates
        patterns:
          - "SonarAnalyzer*"
      # One PR for all open NuGet security fixes (version groups must not swallow these).
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  # Docs site (Docusaurus, pnpm). Most Dependabot alerts come from transitive
  # packages in docs/endatix-docs/pnpm-lock.yaml. Without this entry the docs
  # got no version updates, so the lockfile drifted and security updates had
  # to jump many versions at once.
  - package-ecosystem: npm
    directory: /docs/endatix-docs
    labels: ["dependencies", "documentation"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    # Hold version updates for two days so a release that gets yanked or
    # compromised soon after publishing is never proposed (security updates skip this).
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all open security fixes in the docs lockfile.
      docs-security:
        applies-to: security-updates
        patterns: ["*"]
      docusaurus:
        applies-to: version-updates
        patterns: ["@docusaurus/*", "redocusaurus"]
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@mdx-js/*"]
      docs-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
        # Still 0.x: a minor bump can rename or drop icons, so it gets its own PR.
        exclude-patterns: ["lucide-react"]

  # WebHost container image (mcr.microsoft.com/dotnet/sdk and aspnet). The tags
  # float on 10.0, so patches arrive through the image itself; this entry only
  # flags a tag change. A new .NET is a deliberate change, so majors are ignored.
  - package-ecosystem: docker
    directory: /src/Endatix.WebHost
    labels: ["dependencies"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
