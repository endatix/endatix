version: 2
updates:
  # Keeps GitHub Actions references (including the SHA-pinned
  # endatix/release-workflows reusable workflows) up to date via PRs.
  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # NuGet via Central Package Management (Directory.Packages.props at repo root).
  # Without this entry, NuGet vulns only surface as NU190x build warnings — Dependabot
  # never opened version PRs for the .NET graph.
  - package-ecosystem: nuget
    directory: /
    labels: ["dependencies"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      microsoft-runtime:
        applies-to: version-updates
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "AspNetCore.*"
      test-deps:
        applies-to: version-updates
        patterns:
          - "xunit*"
          - "NSubstitute*"
          - "FluentAssertions*"
          - "Testcontainers*"
          - "coverlet*"
      analyzers-sonar:
        applies-to: version-updates
        patterns:
          - "SonarAnalyzer*"
      # One PR for all open NuGet security fixes (version groups must not swallow these).
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  # Docs site (Docusaurus, pnpm). Most Dependabot alerts come from transitive
  # packages in docs/endatix-docs/pnpm-lock.yaml. Without this entry the docs
  # got no version updates, so the lockfile drifted and security updates had
  # to jump many versions at once.
  - package-ecosystem: npm
    directory: /docs/endatix-docs
    labels: ["dependencies", "documentation"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    # Hold version updates for two days so a release that gets yanked or
    # compromised soon after publishing is never proposed (security updates skip this).
    cooldown:
      default-days: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all open security fixes in the docs lockfile.
      docs-security:
        applies-to: security-updates
        patterns: ["*"]
      docusaurus:
        applies-to: version-updates
        patterns: ["@docusaurus/*", "redocusaurus"]
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@mdx-js/*"]
      docs-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
        # Still 0.x: a minor bump can rename or drop icons, so it gets its own PR.
        exclude-patterns: ["lucide-react"]
