# globalHeaders from staticwebapp.config.json, then the headers the Static Web App added on its
# own (seen on the live site), less Strict-Transport-Security, which the Ingress sets. Included in
# each location: nginx drops the server's add_header lines in a location that has its own.
add_header Content-Security-Policy "default-src https: 'unsafe-eval' 'unsafe-inline'; object-src 'none'; worker-src blob:; img-src https: data:" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Cache-Control "public, must-revalidate, max-age=30" always;
