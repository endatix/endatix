# The docs' static-file server in the container image (deploy/Dockerfile). It replaces Azure
# Static Web Apps, whose rules are in staticwebapp.config.json: keep the two in step until that
# file goes. HSTS is not set here; the cluster's Ingress adds it.
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/json application/javascript application/json
        application/xml image/svg+xml;

    # The path without the query string. Taken from $request_uri, which keeps its value through
    # the internal redirect to the 404 page, so that redirect cannot match a rule again.
    map $request_uri $request_path {
        "~^(?<path>[^?]*)" $path;
    }

    # The routes' redirects. Static Web Apps matches a route with or without a trailing slash,
    # and drops the query string.
    map $request_path $route_redirect {
        default "";
        ~^/docs/end-users/forms/translation-and-localization/localization-overview/?$ /docs/end-users/forms/translation-and-localization;
        ~^/docs/getting-started/installation/?$ /docs/getting-started/setup-nuget-package;
        ~^/docs/building-your-solution/hosting/?$ /docs/building-your-solution;
        ~^/docs/guides/docker-setup/?$ /docs/building-your-solution/deployment/self-hosting;
        ~^/docs/getting-started/setup-docker/?$ /docs/building-your-solution/deployment/self-hosting;
        ~^/docs/settings/?$ /docs/configuration/settings/;
        ~^/docs/configuration/settings/jwt-settings/?$ /docs/configuration/settings/auth-settings;
        ~^/docs/settings/cors-settings/?$ /docs/configuration/settings/cors-settings;
        ~^/docs/settings/data-settings/?$ /docs/configuration/settings/data-settings;
        ~^/docs/settings/health-settings/?$ /docs/configuration/settings/health-checks;
        ~^/docs/configuration/settings/health-settings/?$ /docs/configuration/settings/health-checks;
        ~^/docs/settings/jwt-settings/?$ /docs/configuration/settings/auth-settings;
        ~^/docs/settings/persistence-settings/?$ /docs/configuration/settings/persistence-settings;
        ~^/docs/settings/hub-settings/?$ /docs/configuration/settings/hub-settings;
        ~^/docs/end-users/overview/?$ /docs/end-users/forms;
        ~^/docs/developers/products-overview/?$ /docs/developers/api/;
    }

    # "trailingSlash": "never". An existing page asked for by its file name or with a trailing
    # slash moves to the bare path, keeping the query string; anything else is a 404. Each map
    # gives the file to probe and the target, or nothing.
    map $request_path $html_probe {
        default "";
        ~^/[^/].*\.html$ $request_path;
    }
    map $request_path $html_target {
        default "";
        ~^(?<stem>.+)/index\.html$ $stem;
        ~^(?<stem>/.+)\.html$ $stem;
    }
    map $request_path $slash_probe {
        default "";
        ~^(?<stem>/[^/].*)/$ $stem/index.html;
    }
    map $request_path $slash_target {
        default "";
        ~^(?<stem>/.+)/$ $stem;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Relative Location headers: the pod sees plain HTTP on 8080, not the public origin.
        absolute_redirect off;
        # For the redirects returned below; each location repeats it.
        include /etc/nginx/site-headers.conf;

        if ($route_redirect) {
            return 301 $route_redirect;
        }

        set $bare_path "";
        if (-f $document_root$html_probe) {
            set $bare_path $html_target;
        }
        if (-f $document_root$slash_probe) {
            set $bare_path $slash_target;
        }
        if ($bare_path) {
            return 301 $bare_path$is_args$args;
        }

        error_page 404 /404.html;

        location / {
            include /etc/nginx/site-headers.conf;
            try_files $uri $uri.html $uri/index.html =404;
        }

        # "mimeTypes": { ".json": "text/json" }
        location ~ \.json$ {
            include /etc/nginx/site-headers.conf;
            types { }
            default_type text/json;
            try_files $uri =404;
        }
    }
}
