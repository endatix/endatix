name: "endatix-app"
services:
  # Telemetry UI for the OTLP data endatix-api and endatix-hub export below: traces,
  # metrics and structured logs in one container, with no Loki/Tempo/Grafana to stand up.
  docker-env-dashboard:
    image: "mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2"
    container_name: "endatix-dashboard"
    environment:
      # Dev-only. Without it the dashboard mints a login token and prints it to its own
      # logs, so opening the UI means digging through `docker logs` first. Safe here ONLY
      # because both ports below are bound to loopback -- never pair this with a 0.0.0.0
      # publish, and never set it in a deployed manifest.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      # Bound to 127.0.0.1 deliberately: the dashboard is unauthenticated (above) and
      # renders every request, log line and form payload the platform handles. A bare
      # "18888:18888" would publish that to the whole LAN.
      - "127.0.0.1:18888:18888" # Dashboard UI
      - "127.0.0.1:18889:18889" # OTLP/gRPC -- published so an API or Hub run outside Docker can export here too
    networks:
      - "endatix-net"
    restart: "always"
  endatix-db:
    image: "docker.io/library/postgres:17.6"
    container_name: "endatix-db"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${ENDATIX_DB_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "endatix.saas.apphost-ae075cb714-endatix-db-data"
        read_only: false
    networks:
      - "endatix-net"
  endatix-api:
    image: "${ENDATIX_API_IMAGE}"
    container_name: "endatix-api"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${ENDATIX_API_PORT}"
      ConnectionStrings__DefaultConnection: "Host=endatix-db;Port=5432;Username=postgres;Password=${ENDATIX_DB_PASSWORD};Database=main-db"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection_DbProvider: "postgresql"
      Endatix__Jwt__SigningKey: "AghmwSuu9G7NCOJd1axzGfRuF8O/cxiahWUUrZMszw8="
      Endatix__Data__EnableAutoMigrations: "true"
      Endatix__Data__SeedSampleData: "true"
      Endatix__Data__SeedSampleForms: "${SEED_SAMPLE_FORMS}"
      Endatix__Data__InitialUser__Email: "${USER_EMAIL}"
      Endatix__Data__InitialUser__Password: "${USER_PASSWORD}"
      Endatix__Cors__DefaultPolicyName: "AllowAll"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "endatix-api"
    ports:
      - "${ENDATIX_API_PORT}:${ENDATIX_API_PORT}"
    depends_on:
      endatix-db:
        condition: "service_started"
    networks:
      - "endatix-net"
    restart: "unless-stopped"
  endatix-hub:
    image: "${ENDATIX_HUB_IMAGE}"
    container_name: "endatix-hub"
    environment:
      NODE_ENV: "production"
      PORT: "8000"
      ENDATIX_API_URL: "http://endatix-api:${ENDATIX_API_PORT}/api"
      ENDATIX_BASE_URL: "http://endatix-api:${ENDATIX_API_PORT}"
      SESSION_SECRET: "Tr9YJeqVsIicqvNgpcn+iJVGq6l4qU95b+GuP/xziMs="
      NEXT_OTEL_VERBOSE: "0"
      AUTH_SECRET: "edukEVrf9XA1GRDN44/BnB+6xeO1xLUWeKRWS7RWoYo="
      AUTH_TRUST_HOST: "true"
      services__endatix-api__http__0: "http://endatix-api:${ENDATIX_API_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "endatix-hub"
    ports:
      - "3000:8000"
    depends_on:
      endatix-api:
        condition: "service_started"
    networks:
      - "endatix-net"
networks:
  endatix-net:
    driver: "bridge"
volumes:
  endatix.saas.apphost-ae075cb714-endatix-db-data:
    driver: "local"
